<div class="registration-wrapper">
  <div class="registration-card">
    <h1 class="registration-title">Registration</h1>

    <form class="registration-form" [formGroup]="formData" (ngSubmit)="register()">
      <div class="form-row">
        <div class="form-group half">
          <input
            id="name"
            class="form-input"
            type="text"
            placeholder="Name"
            formControlName="name"
          />
        </div>
        <div class="form-group half">
          <input
            id="lastname"
            class="form-input"
            type="text"
            placeholder="Lastname"
            formControlName="lastname"
          />
        </div>
      </div>

      <div class="form-group">
        <input
          id="email"
          class="form-input"
          type="email"
          placeholder="E-mail"
          formControlName="email"
        />
      </div>

      <div class="form-group" *ngIf="role !== 'ADMIN'">
        <input
          id="password"
          class="form-input"
          type="password"
          placeholder="Password"
          (input)="checkPassword()"
          formControlName="password"
        />

        <div style="color: antiquewhite">
          Strength:
          <span [ngSwitch]="strengthScore">
            <span *ngSwitchCase="0">Very weak</span>
            <span *ngSwitchCase="1">Weak</span>
            <span *ngSwitchCase="2">Fair</span>
            <span *ngSwitchCase="3">Good</span>
            <span *ngSwitchCase="4">Strong</span>
          </span>
        </div>
        <div *ngIf="feedback">Hint: {{ feedback }}</div>
      </div>

      <div class="form-group" *ngIf="role !== 'ADMIN'">
        <input
          id="confirmPassword"
          class="form-input"
          type="password"
          placeholder="Confirm password"
          formControlName="confirmPassword"
        />
      </div>

      <div class="form-group" style="position: relative">
        <input
          id="organization"
          class="form-input"
          type="text"
          placeholder="Organization"
          formControlName="organization"
          autocomplete="off"
          readonly
          (focus)="showOrgDropdown = true; filteredOrgs = organizations"
          (blur)="hideDropdown()"
        />
        <ul class="combo-dropdown" *ngIf="showOrgDropdown && filteredOrgs.length > 0">
          <li *ngFor="let org of filteredOrgs" (mousedown)="selectOrg(org)">
            {{ org.name }}
          </li>
        </ul>
      </div>

      <div class="form-group">
        <label style="color: antiquewhite">Public Key</label>
        <textarea formControlName="publicKey" rows="5" readonly></textarea>
      </div>

      <div class="form-group">
        <button type="button" id="keyaActions" class="key-actions" (click)="generateKeys()">
          Generate New Key Pair
        </button>
      </div>

      <div class="form-group submit-group">
        <p class="errormsg" [style.display]="errormsg != null ? 'block' : 'none'">{{ errormsg }}</p>
        <button id="submitBtn" class="submit-btn" type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
