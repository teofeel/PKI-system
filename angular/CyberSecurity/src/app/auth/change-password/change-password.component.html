<div class="registration-wrapper">
  <div class="registration-card">
    <h1 class="registration-title">Change password</h1>

    <form class="registration-form" [formGroup]="formData" (ngSubmit)="getChallenge()">
      <div class="form-group">
        <input
          id="email"
          class="form-input"
          type="email"
          placeholder="E-mail"
          formControlName="email"
        />
      </div>
      <div class="form-group submit-group">
        <p class="errormsg" [style.display]="errormsg != null ? 'block' : 'none'">{{ errormsg }}</p>
        <button id="submitBtn" class="submit-btn" type="submit">Submit</button>
      </div>
    </form>

    @if (challengeDTO.secret) {
      <p class="upload-hint">Upload your <code>.pem</code> file to proceed</p>

      <label for="fileInput" class="custom-file-upload">
        <div class="upload-content">
          <span class="upload-text">{{ selectedFileName || 'Choose Private Key' }}</span>
        </div>
      </label>

      <input type="file" (change)="onFileSelected($event)" id="fileInput" accept=".pem" />

      <button class="btn-verify" *ngIf="selectedFileName" (click)="onUpload()">
        Verify & Activate
      </button>
    }
  </div>
</div>
