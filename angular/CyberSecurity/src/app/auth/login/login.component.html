<div class="registration-wrapper">
  <div class="registration-card">
    <h1 class="registration-title">Login</h1>

    <form
      *ngIf="!showTwoFactor"
      class="registration-form"
      [formGroup]="formData"
      (ngSubmit)="login()"
    >
      <div class="form-group">
        <input
          id="email"
          class="form-input"
          type="email"
          placeholder="E-mail"
          formControlName="email"
        />
      </div>

      <div class="form-group">
        <input
          id="password"
          class="form-input"
          type="password"
          placeholder="Password"
          formControlName="password"
        />
      </div>

      <a routerLink="/change-password" style="color: darkred">Forgot your password?</a>

      <div class="form-group submit-group">
        <p class="errormsg" [style.display]="errormsg != null ? 'block' : 'none'">{{ errormsg }}</p>
        <button id="submitBtn" class="submit-btn" type="submit">Submit</button>
      </div>
    </form>

    <div *ngIf="showTwoFactor" class="registration-form">
      <div class="form-group">
        <input
          id="twoFactorCode"
          class="form-input"
          type="text"
          placeholder="Enter 2FA code"
          [formControl]="twoFactorCode"
          autocomplete="one-time-code"
        />
      </div>

      <div class="form-group submit-group">
        <p class="errormsg" [style.display]="errormsg != null ? 'block' : 'none'">
          {{ errormsg }}
        </p>
        <button id="verifyBtn" class="submit-btn" type="button" (click)="verify2FA()">
          Verify
        </button>
      </div>
    </div>
  </div>
</div>
