<div class="registration-wrapper">
  <div class="registration-card">
    <h1 class="registration-title">Login</h1>

    <form class="registration-form" [formGroup]="formData" (ngSubmit)="login()">

      <div class="form-group">
        <input
          id="email"
          class="form-input"
          type="email"
          placeholder="E-mail"
          formControlName="email"
        />
      </div>

      <div class="form-group">
        <input
          id="password"
          class="form-input"
          type="password"
          placeholder="Password"
          formControlName="password"
        />
      </div>

      <div class="form-group submit-group">
        <p class="errormsg" [style.display]="errormsg != null ? 'block' : 'none'">{{ errormsg }}</p>
        <button id="submitBtn" class="submit-btn" type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
