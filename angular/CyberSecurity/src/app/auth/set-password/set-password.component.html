<div id="container">
  <form [formGroup]="passwordForm" [style.display]="validToken === true ? 'block' : 'none'">
    <div>
      <input
        type="password"
        formControlName="password"
        placeholder="Password"
        (input)="checkPassword()"
      />
      <div style="color: antiquewhite">
        Strength:
        <span [ngSwitch]="strengthScore">
          <span *ngSwitchCase="0">Very weak</span>
          <span *ngSwitchCase="1">Weak</span>
          <span *ngSwitchCase="2">Fair</span>
          <span *ngSwitchCase="3">Good</span>
          <span *ngSwitchCase="4">Strong</span>
        </span>
      </div>
      <div style="color: antiquewhite" *ngIf="feedback">Hint: {{ feedback }}</div>
    </div>

    <input type="password" formControlName="confirm" placeholder="Confirm Password" />

    <hr />
    <p>Choose your new password and confirm it</p>
    <p class="errormsg" [style.display]="showError ? 'block' : 'none'">{{ errormsg }}</p>
    <button class="form-button-one" (click)="setPassword()">Verify Account</button>
  </form>
  <h1 [style.display]="validToken === false ? 'block' : 'none'">Invalid Link!</h1>
</div>
