<div class="cl-wrapper">
  <ul class="cl-list">
    <li class="cl-item" *ngFor="let cert of certificates">
      <div class="cl-expand-slot">
        <ng-container *ngIf="canExpand(cert.type); else noButton">
          <button
            class="cl-expand-btn"
            [title]="'Expand ' + cert.commonName"
            (click)="onExpand(cert); $event.stopPropagation()"
            aria-label="Expand certificate chain"
            [attr.aria-expanded]="cert.isExpanded"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="cl-expand-icon"
              [class.is-rotated]="cert.isExpanded"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </ng-container>

        <ng-template #noButton>
          <span class="cl-expand-placeholder" aria-hidden="true"></span>
        </ng-template>
      </div>

      <div class="cl-avatar" [attr.data-type]="cert.type">
        {{ getInitials(cert.type) }}
      </div>

      <button
        type="button"
        class="cl-info-btn"
        [attr.aria-label]="'View details for ' + cert.commonName"
        (click)="goToDetails(cert.id)"
      >
        <span class="cl-domain">{{ cert.commonName }}</span>
        <span class="cl-dates"> {{ cert.validFrom }}&nbsp;→&nbsp;{{ cert.validUntil }} </span>
      </button>

      <div class="cl-badges">
        <span class="cl-badge cl-badge--type">{{ cert.type }}</span>
        <span class="cl-badge cl-badge--status" [attr.data-status]="cert.status.toLowerCase()">
          {{ cert.status }}
        </span>
      </div>

      <div class="cl-actions">
        <div class="cl-download-dropdown">
          <button
            type="button"
            class="cl-action-btn cl-download-btn"
            [title]="'Download ' + cert.commonName"
            (click)="toggleDownloadMenu(cert, $event)"
            aria-label="Download certificate options"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="cl-action-icon"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>

          <div class="cl-dropdown-menu" *ngIf="$any(cert).showDownloadMenu">
            <ng-container *ngIf="!$any(cert).showPasswordForm; else passwordFormTpl">
              <button
                type="button"
                class="cl-dropdown-item"
                (click)="download(cert.id, 'pem', false)"
              >
                Export as .PEM
              </button>
              <button
                type="button"
                class="cl-dropdown-item"
                (click)="download(cert.id, 'cer', false)"
              >
                Export as .CER
              </button>
              <button
                type="button"
                class="cl-dropdown-item"
                (click)="switchToPasswordForm(cert, $event)"
              >
                Export as PKCS12 (.p12)
              </button>
            </ng-container>

            <ng-template #passwordFormTpl>
              <div class="cl-pwd-form" (click)="$event.stopPropagation()">
                <label class="cl-pwd-label">Protect Keystore</label>
                <input
                  #pkPassword
                  type="password"
                  class="cl-pwd-input"
                  placeholder="Enter secure password"
                  (keyup.enter)="download(cert.id, 'p12', true, pkPassword)"
                />
                <div class="cl-pwd-actions">
                  <button
                    type="button"
                    class="cl-pwd-btn cl-pwd-btn--cancel"
                    (click)="cancelPasswordForm(cert, $event)"
                  >
                    Back
                  </button>
                  <button
                    type="button"
                    class="cl-pwd-btn cl-pwd-btn--submit"
                    (click)="download(cert.id, 'p12', true, pkPassword)"
                  >
                    Export
                  </button>
                </div>
              </div>
            </ng-template>
          </div>
        </div>

        <div class="cl-revoke-wrapper" (click)="$event.stopPropagation()">
          <button type="button" class="cl-revoke-btn" (click)="toggleRevokeForm(cert, $event)">
            <i class="ti ti-shield-x" aria-hidden="true"></i>
            Revoke
          </button>

          <div class="cl-revoke-form-panel" *ngIf="$any(cert).showRevokeForm">
            <div class="cl-panel-title">
              <i class="ti ti-alert-triangle" aria-hidden="true"></i>
              Revoke certificate
            </div>

            <label for="revokeReason">Reason for revocation</label>
            <select
              class="cl-reason-select"
              [(ngModel)]="$any(cert).revokeReason"
              (change)="onRevokeReasonChange(cert)"
            >
              <option value="">— Choose reason for revocation —</option>
              <option value="KEY_COMPROMISE">Key compromise</option>
              <option value="CA_COMPROMISE">CA compromise</option>
              <option value="AFFILIATION_CHANGED">Affiliation changed</option>
              <option value="SUPERSEDED">Superseded</option>
              <option value="CERTIFICATE_HOLD">Certificate hold</option>
              <option value="REMOVE_FROM_CRL">Remove from crl</option>
              <option value="PRIVILEGE_WITHDRAWN">Privilege withdrawn</option>
              <option value="AA_COMPROMISE">AA compromise</option>
              <option value="other">Other</option>
            </select>

            <ng-container *ngIf="$any(cert).revokeReason === 'other'">
              <label>Reason (optional)</label>
              <textarea
                class="cl-reason-textarea"
                [(ngModel)]="$any(cert).revokeNote"
                placeholder="Details..."
              ></textarea>
            </ng-container>

            <div class="cl-revoke-actions">
              <button type="button" class="cl-btn-cancel" (click)="cancelRevokeForm(cert, $event)">
                Cancel
              </button>
              <button
                type="button"
                class="cl-btn-revoke-confirm"
                [disabled]="!$any(cert).revokeReason"
                (click)="confirmRevoke(cert, $event)"
              >
                Confirm
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="cl-nested-container" *ngIf="cert.isExpanded">
        <div *ngIf="cert.isLoading" class="cl-loader">Loading...</div>

        <app-certificate-list
          *ngIf="cert.children && cert.children.length > 0"
          [certificates]="cert.children"
          [role]="role"
        >
        </app-certificate-list>

        <div *ngIf="!cert.isLoading && cert.children?.length === 0" class="cl-no-results">
          No issued certificates found.
        </div>
      </div>
    </li>
  </ul>
  <div *ngIf="isLoading" class="cl-loader">Loading certificates...</div>
  <p class="cl-empty" *ngIf="!isLoading && certificates.length === 0">No certificates found.</p>
</div>
