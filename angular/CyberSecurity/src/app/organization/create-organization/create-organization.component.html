<div class="wrapper">
  <div class="card">
    <h1 class="title">Create Organization</h1>

    <form class="form" [formGroup]="formData" (ngSubmit)="create()">

      <div class="form-group">
        <input
          id="name"
          class="form-input"
          type="text"
          placeholder="Name"
          formControlName="name"
        />
      </div>

      <div class="form-group submit-group">
        <button id="submitBtn" class="submit-btn" type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
