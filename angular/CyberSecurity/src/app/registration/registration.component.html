<div class="registration-wrapper">
  <div class="registration-card">
    <h1 class="registration-title">Registration</h1>

    <form class="registration-form" (ngSubmit)="onSubmit()" #registrationForm="ngForm">
      <div class="form-row">
        <div class="form-group half">
          <input
            id="name"
            class="form-input"
            type="text"
            placeholder="Name"
            name="name"
            [(ngModel)]="formData.name"
            required
          />
        </div>
        <div class="form-group half">
          <input
            id="lastname"
            class="form-input"
            type="text"
            placeholder="Lastname"
            name="lastname"
            [(ngModel)]="formData.lastname"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <input
          id="email"
          class="form-input"
          type="email"
          placeholder="E-mail"
          name="email"
          [(ngModel)]="formData.email"
          required
        />
      </div>

      <div class="form-group">
        <input
          id="password"
          class="form-input"
          type="password"
          placeholder="Password"
          name="password"
          [(ngModel)]="formData.password"
          required
        />
      </div>

      <div class="form-group">
        <input
          id="confirmPassword"
          class="form-input"
          type="password"
          placeholder="Confirm password"
          name="confirmPassword"
          [(ngModel)]="formData.confirmPassword"
          required
        />
      </div>

      <div class="form-group">
        <input
          id="organization"
          class="form-input"
          type="text"
          placeholder="Organization"
          name="organization"
          [(ngModel)]="formData.organization"
        />
      </div>

      <div class="form-group submit-group">
        <button id="submitBtn" class="submit-btn" type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
